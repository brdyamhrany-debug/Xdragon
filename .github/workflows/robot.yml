name: Update Sub

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - sources.txt
      - .github/workflows/robot.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Merge subs
        run: |
          python3 << 'PY'
          import urllib.request, base64, re, ssl
          ssl._create_default_https_context = ssl._create_unverified_context

          with open('sources.txt', encoding='utf-8') as f:
              urls = [l.strip() for l in f if l.strip() and not l.strip().startswith('#')]

          all_nodes = set()
          headers = {'User-Agent': 'Mozilla/5.0'}

          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      text = r.read().decode('utf-8', errors='ignore').strip()
                  # اگر base64 بود بازش کن
                  if '://' not in text[:200] and len(text) > 100:
                      try:
                          missing = len(text) % 4
                          if missing:
                              text += '=' * (4 - missing)
                          text = base64.b64decode(text).decode('utf-8', errors='ignore')
                      except:
                          pass
                  # فقط کانفیگ‌ها رو نگه دار
                  for line in re.split(r'[\r\n\s]+', text):
                      line = line.strip()
                      if line.startswith(('vless://', 'vmess://', 'trojan://', 'ss://', 'tuic://', 'hysteria2://', 'hy2://', 'wireguard://')):
                          all_nodes.add(line)
                  print(f'OK: {url} -> total: {len(all_nodes)}')
              except Exception as e:
                  print(f'FAIL: {url} -> {e}')

          with open('sub.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(sorted(all_nodes)))

          print(f'Done: {len(all_nodes)} nodes saved to sub.txt')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sub.txt
          git commit -m "update sub $(date -u '+%Y-%m-%d %H:%M UTC')" || exit 0
          git push
